# Codex: CI shared ตาม ADR-0005 (path-filter + generated types consistency check)
name: ci-shared

on:
  push:
    branches: [main]
    paths:
      - "packages/shared/**"
      - ".github/workflows/ci-shared.yml"
  pull_request:
    paths:
      - "packages/shared/**"
      - ".github/workflows/ci-shared.yml"

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure generated types placeholder exists
        run: test -f packages/shared/src/types.generated.ts

      - name: Verify no accidental delete of shared entrypoints
        run: |
          test -f packages/shared/src/index.ts
          test -f packages/shared/package.json

      - name: Placeholder generate-types check
        run: echo "Phase 1 skeleton: OpenAPI type generation will be wired in Phase 2."
