# Codex: CI backend ตาม ADR-0005 (path-filter + quality checks + image build)
name: ci-backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "pyproject.toml"
      - "uv.lock"
      - "apps/backend/Dockerfile"
      - "apps/backend/Dockerfile.worker"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "pyproject.toml"
      - "uv.lock"
      - "apps/backend/Dockerfile"
      - "apps/backend/Dockerfile.worker"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync backend dependencies
        run: uv sync --package joggy-backend --dev

      - name: Ruff
        run: uv run --package joggy-backend ruff check apps/backend

      - name: Mypy
        run: uv run --package joggy-backend mypy apps/backend

      - name: Pytest
        run: |
          if [ -d "apps/backend/tests" ]; then
            uv run --package joggy-backend pytest apps/backend/tests -q
          else
            echo "No backend tests yet (Phase 1 skeleton)."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/joggy-picx-backend:main-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/joggy-picx-backend:main-latest

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile.worker
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/joggy-picx-worker:main-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/joggy-picx-worker:main-latest
