# Codex: กำหนด uv workspace กลางของ monorepo และตั้งค่า tooling ขั้นพื้นฐานสำหรับ Python apps
[tool.uv.workspace]
members = [
  "apps/backend",
  "apps/edge",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = [
  "^apps/frontend/",
]
