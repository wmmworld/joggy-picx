# Joggy-PicX production reverse proxy
# Author: Claude (Tech Lead) — Phase 5 production deploy, 2026-06-06
#
# Two server blocks:
#   - :80  → ACME challenge + redirect to HTTPS
#   - :443 → reverse-proxy to fastapi:8000 (TLS terminated here)
#
# SSL certs come from host /etc/letsencrypt (read-only mount in compose).
# To bootstrap before the cert exists, see docs/production-deploy.md §SSL.

# DNS resolver (Docker embedded DNS at 127.0.0.11) — required because
# nginx caches upstream IPs at boot. When `fastapi` container restarts it
# gets a new IP and stale upstream returns "Host is unreachable" 502.
# Bug seen in production on 2026-06-09 after rebuilding fastapi container.
#
# Using a `set` + variable in proxy_pass forces nginx to re-resolve on every
# request via this resolver instead of caching at startup.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── HTTP :80 ─────────────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # ACME http-01 challenge — certbot writes to /var/www/certbot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Internal health probe — no redirect (so docker healthcheck works on :80)
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Everything else → force HTTPS once cert exists.
  # During bootstrap (no cert), comment the redirect to test plain HTTP.
  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS :443 ────────────────────────────────────────────────────────────────
# NOTE: this server block is wrapped in an include so nginx doesn't crash
# during initial deploy before the cert exists. After running certbot, drop
# the file infra/nginx/conf.d/ssl.enabled to activate it.
include /etc/nginx/conf.d/ssl-*.conf;
