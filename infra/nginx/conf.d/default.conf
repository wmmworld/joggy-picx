# Codex: server block skeleton สำหรับ route เข้าสู่ FastAPI backend
upstream joggy_fastapi {
  server fastapi:8000;
}

server {
  listen 80;
  server_name _;

  location /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://joggy_fastapi;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
