# Joggy-PicX production overlay
# Usage on Hetzner VPS:
#   cd /opt/joggy-picx/infra
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file:
#   - Loads secrets from ../.env.production (NOT committed)
#   - Wires FastAPI/worker to Supabase Postgres + Cloudflare R2 + Redis
#   - Adds healthchecks + restart policies
#   - Mounts model files for the worker (apps/backend/models/*.onnx)
#   - Exposes nginx on 80 + 443 (cert volume populated by host certbot)
#
# Author: Claude (Tech Lead) — Phase 5 production deploy, 2026-06-06

services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  fastapi:
    env_file:
      - ../.env.production
    environment:
      # Override REDIS_URL for in-network access (overrides .env value which uses host port)
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      WEB_CONCURRENCY: "2"
    # Worker process count = WEB_CONCURRENCY env var (read by uvicorn at boot)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    env_file:
      - ../.env.production
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      MODEL_DIR: /app/apps/backend/models
    volumes:
      # Model files are gitignored (12 MB ONNX) — mount from host
      - ../apps/backend/models:/app/apps/backend/models:ro

  redis:
    # Disable host port mapping in production — only fastapi/worker need it
    # (override docker-compose.yml `ports:` by reassigning to empty list)
    ports: []
    deploy:
      resources:
        limits:
          memory: 200M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  watchtower:
    # Production poll interval — 5 min is fine for non-emergency rollouts
    environment:
      WATCHTOWER_NOTIFICATION_URL: "${WATCHTOWER_NOTIFICATION_URL:-}"
